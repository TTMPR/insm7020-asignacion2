name: Run INSM 7020 Analysis

on:
  workflow_dispatch:
  push:
    paths:
      - "*.py"
      - "*.csv"
      - "requirements.txt"
      - ".github/workflows/run-analysis.yml"

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run statistical analysis
        run: python Joel_Vega_INSM7020_Asignacion2_Analisis.py

      - name: Upload analysis outputs
        uses: actions/upload-artifact@v4
        with:
          name: resultados-asignacion2
          path: salidas_asignacion2/
